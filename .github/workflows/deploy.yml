name: Deploy to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "src,pom.xml,mvnw,Dockerfile,docker-compose.prod.yml,.env.example,.mvn"
          target: "/home/ubuntu/oficina"
          overwrite: true

      - name: Execute Docker Compose on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/oficina
            # Garante que o script do maven tem permissão de execução
            chmod +x mvnw
            
            # Faz o build da nova imagem ignorando o cache para garantir que pega o código mais recente
            docker compose -f docker-compose.prod.yml build --no-cache app
            
            # Sobe o container novamente (recriando-o) e limpando containers órfãos
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
