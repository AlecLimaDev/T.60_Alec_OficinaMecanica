services:
  mysql:
    image: mysql:8.0
    container_name: oficina_mecanica_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: oficina_mecanica
    ports:
      - "3307:3306"
    volumes:
      - oficina_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oficina_data:
